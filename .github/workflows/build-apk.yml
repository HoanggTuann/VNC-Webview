name: Build and Sign APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Tự động tạo và cài đặt Gradle đầy đủ
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      # Build APK bằng Gradle hệ thống (Bỏ qua bước chmod gradlew)
      - name: Build Release APK
        run: gradle assembleRelease

      # Giải mã Keystore từ Secrets
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > app/release.keystore

      # Ký APK bằng apksigner
      - name: Sign Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          $BUILD_TOOLS_DIR/apksigner sign \
            --ks app/release.keystore \
            --ks-pass pass:"$KEYSTORE_PASSWORD" \
            --ks-key-alias "$KEY_ALIAS" \
            --key-pass pass:"$KEY_PASSWORD" \
            --out app/build/outputs/apk/release/app-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      # Xuất file APK đã ký ra mục Artifacts
      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-release
          path: app/build/outputs/apk/release/app-release-signed.apk
          